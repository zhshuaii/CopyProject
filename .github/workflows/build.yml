name: Build CopyProject

on:
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          msbuild .\CopyProject.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /v:minimal

      - name: Prepare artifact
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item '.\CopyProject\bin\Release\CopyProject.exe' $dist
          Copy-Item '.\CopyProject\bin\Release\CopyProject.exe.config' $dist
          Copy-Item '.\CopyProject\bin\Release\CopyProject.pdb' $dist -ErrorAction SilentlyContinue

          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          @(
            "Project: CopyProject"
            "Target: .NET Framework 4.6.2"
            "Configuration: Release / Any CPU"
            "Branch: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_RUN_NUMBER"
            "BuiltUtc: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content -Encoding UTF8 (Join-Path $dist 'BUILD.txt')

          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: CopyProject-net462-run${{ github.run_number }}-${{ env.SHORT_SHA }}
          path: dist\
          if-no-files-found: error
          retention-days: 30
